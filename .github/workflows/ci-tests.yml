name: "CI testing | CPU"

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: ${{ ! (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}

defaults:
  run:
    shell: bash

jobs:
  pytest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    timeout-minutes: 60
    env:
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install paddlepaddle-cpu
        run: |
          python -m pip install --upgrade pip
          pip install paddlepaddle

      - name: Install test & domain dependencies
        run: |
          pip install -e ".[tests,classification,regression,detection,image,text,nominal,clustering,segmentation,retrieval]"

      - name: Verify package import
        run: python -c "import paddlemetrics; print('paddlemetrics imported OK')"

      - name: Unittests — bases
        run: |
          python -m pytest tests/unittests/bases/ \
            -m "not DDP" \
            --timeout=120 \
            -v --tb=short \
            --durations=30

      - name: Unittests — classification
        run: |
          python -m pytest tests/unittests/classification/ \
            -m "not DDP" \
            --timeout=120 \
            -v --tb=short \
            --durations=30

      - name: Unittests — regression
        run: |
          python -m pytest tests/unittests/regression/ \
            -m "not DDP" \
            --timeout=120 \
            -v --tb=short \
            --durations=30

      - name: Unittests — retrieval
        run: |
          python -m pytest tests/unittests/retrieval/ \
            -m "not DDP" \
            --timeout=120 \
            -v --tb=short \
            --durations=30

      - name: Unittests — image & detection
        run: |
          python -m pytest tests/unittests/image/ tests/unittests/detection/ \
            -m "not DDP" \
            --timeout=120 \
            -v --tb=short \
            --durations=30

      - name: Unittests — text
        run: |
          python -m pytest tests/unittests/text/ \
            -m "not DDP" \
            --timeout=120 \
            -v --tb=short \
            --durations=30

      - name: Unittests — nominal
        run: |
          python -m pytest tests/unittests/nominal/ \
            -m "not DDP" \
            --timeout=120 \
            -v --tb=short \
            --durations=30

      - name: Unittests — clustering
        run: |
          python -m pytest tests/unittests/clustering/ \
            -m "not DDP" \
            --timeout=120 \
            -v --tb=short \
            --durations=30

      - name: Unittests — segmentation & shape
        run: |
          python -m pytest tests/unittests/segmentation/ tests/unittests/shape/ \
            -m "not DDP" \
            --timeout=120 \
            -v --tb=short \
            --durations=30

      - name: Unittests — wrappers
        run: |
          python -m pytest tests/unittests/wrappers/ \
            -m "not DDP" \
            --timeout=120 \
            -v --tb=short \
            --durations=30

      - name: Unittests — utilities
        run: |
          python -m pytest tests/unittests/utilities/ \
            -m "not DDP" \
            --timeout=120 \
            -v --tb=short \
            --durations=30

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check paddlemetrics/ --output-format=github
        continue-on-error: true

  testing-guardian:
    runs-on: ubuntu-latest
    needs: [pytest, lint]
    if: always()
    steps:
      - run: echo "${{ needs.pytest.result }} / ${{ needs.lint.result }}"
      - name: failing...
        if: needs.pytest.result == 'failure'
        run: exit 1
